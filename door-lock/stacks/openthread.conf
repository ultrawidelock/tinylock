# Stock Thread stack: OpenThread and tinytalk's port on it. Replaced by
# stacks/tinygrid.conf.

CONFIG_TINYTALK_THREAD=y

# ---- Thread: an OpenThread MTD ----------------------------------------------------
CONFIG_OPENTHREAD=y
CONFIG_OPENTHREAD_MTD=y
CONFIG_OPENTHREAD_SRP_CLIENT=y
CONFIG_OPENTHREAD_SLAAC=y
# The node starts Thread when a commissioner hands it a dataset.
CONFIG_OPENTHREAD_MANUAL_START=y
# The Interaction Model runs on this stack. The 3,168 B default overflowed at
# CommissioningComplete; measured peak after a complete pairing: 3,072 B.
CONFIG_OPENTHREAD_THREAD_STACK_SIZE=4096
# Nothing calls otPing* or otInstanceGetUptime*: 936 B of dead text.
CONFIG_OPENTHREAD_PING_SENDER=n
CONFIG_OPENTHREAD_UPTIME=n
# An always-listening MTD child uses none of 1.2 to 1.4's additions (CSL,
# enhanced-ACK probing, multicast registration). Measured 2026-10-16 on
# decawave_dwm3001cdk, LTO on: 4,932 B less flash and 384 B less RAM than 1.4.
CONFIG_OPENTHREAD_THREAD_VERSION_1_1=y
