# Needs tinygrid on ZEPHYR_EXTRA_MODULES. Use after stacks/tinygrid.conf.

# tinygrid's own radio driver in the Bluetooth controller's gaps, in place
# of Nordic's 802.15.4 driver. The NRF_802154_* lines in stacks/tinygrid.conf
# then apply to nothing; Kconfig warns about each one.
CONFIG_TINYGRID_RADIO_OWN=y
