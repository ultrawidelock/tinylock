# tinycred: the credential reader (Aliro access protocol on an L2CAP channel,
# UWB ranging on tinyuwb). Needs stacks/tinyble.conf, stacks/tinypsa.conf and
# stacks/tinyuwb.conf with its overlay. Its identity and trust store live in
# settings ("tinycred/prov").
CONFIG_TINYCRED=y
CONFIG_TINYTALK_DOOR_LOCK_ALIRO=y
# The transaction's P-256 work runs on the system work queue, where tinyble
# delivers the channel's SDUs. 6 KiB (prj.conf) is for the Matter node alone.
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=8192
