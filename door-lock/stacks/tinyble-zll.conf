# tinyble on Zephyr's own Bluetooth LE controller (Apache-2.0) instead of the
# SoftDevice Controller. Takes RTC0, TIMER0 and the radio, so no MPSL;
# tinygrid's radio (stacks/tinygrid-radio.conf) then runs in this controller's
# scheduler instead. Pass stacks/tinyble-zll.overlay as well (the chosen HCI
# node).
CONFIG_BT_LL_SOFTDEVICE=n
CONFIG_BT_LL_SW_SPLIT=y
CONFIG_MPSL=n
CONFIG_BT_CTLR_CONN_RSSI=y
