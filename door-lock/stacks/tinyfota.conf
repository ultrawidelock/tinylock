# Needs tinyfota on ZEPHYR_EXTRA_MODULES, next to tinytalk (f9e09b2 or later,
# for the scan response line at the end). Adds DFU on top
# of the stock stacks; replaces no fragment. It works only with the three
# files in stacks/tinyfota/, which are opt-in from the command line so that
# every other build stays without MCUboot:
#
#   west build -p always -b decawave_dwm3001cdk --sysbuild -d <build> <tinylock>/door-lock -- \
#     -DZEPHYR_EXTRA_MODULES="<tinytalk>;<tinyfota>" \
#     -DCONF_FILE="prj.conf;stacks/bt-host.conf;stacks/openthread.conf;stacks/nrf-security.conf;stacks/tinyfota.conf" \
#     -DSB_CONF_FILE=stacks/tinyfota/sysbuild.conf \
#     -DPM_STATIC_YML_FILE=stacks/tinyfota/pm_static.yml \
#     -Dmcuboot_CONF_FILE=<tinylock>/door-lock/stacks/tinyfota/mcuboot.conf \
#     '-DSB_CONFIG_BOOT_SIGNATURE_KEY_FILE="<key>"'
#
# SB_CONF_FILE and PM_STATIC_YML_FILE resolve against door-lock/;
# mcuboot_CONF_FILE needs an absolute path and replaces MCUboot's own
# prj.conf and board fragment. The key path is a Kconfig string and needs its
# double quotes; without them sysbuild ignores it and stops on the warning.
# The signing key goes on the command line only, never in a file. The
# application side (update window gesture, SMP advert) is not in main.c yet.
#
# The lines below are tinyfota's samples/door-lock-fragment/tinyfota.conf at
# f85f24e, verbatim; "README.md beside this file" is that directory's.

# tinyfota receiver for an application that owns sw0 and keeps one BLE
# connection: SMP over GATT only, no tinyfota button, no recovery gesture.
# The application opens the update window with tinyfota_window_open().
# README.md beside this file says where each line comes from.

CONFIG_TINYFOTA_RECEIVER=y
CONFIG_TINYFOTA_BLE_SMP=y
CONFIG_TINYFOTA_BLE_GATT=n
CONFIG_TINYFOTA_BLE_COC=n
CONFIG_TINYFOTA_BUTTON=n
CONFIG_TINYFOTA_RECOVERY_GESTURE=n
CONFIG_FLASH_PAGE_LAYOUT=y

# In single-slot mode MCUboot's trailer does not depend on the sector count
# (samples/nrf52833/pm_static.yml says why).
CONFIG_MCUBOOT_EXTRA_IMGTOOL_ARGS="--max-sectors 1"

# mcumgr: SMP over Bluetooth, what tinyfota push and the browser page speak.
CONFIG_ZCBOR=y
CONFIG_MCUMGR=y
CONFIG_MCUMGR_TRANSPORT_BT=y
# Hands an unpaired peer the SMP endpoint; the update window and the reset gate
# (ports/zephyr/dfu_smp_img.c) are what stand in front of it.
CONFIG_MCUMGR_TRANSPORT_BT_PERM_RW=y
CONFIG_MCUMGR_TRANSPORT_NETBUF_COUNT=2
CONFIG_MCUMGR_TRANSPORT_WORKQUEUE_STACK_SIZE=2048
CONFIG_MCUMGR_GRP_OS=y
# The reset gate: without it any peer in range can reboot the lock.
CONFIG_MCUMGR_MGMT_NOTIFICATION_HOOKS=y
CONFIG_MCUMGR_GRP_OS_RESET_HOOK=y
CONFIG_MCUMGR_GRP_OS_TASKSTAT=n
CONFIG_MCUMGR_GRP_OS_INFO=n
CONFIG_MCUMGR_GRP_OS_BOOTLOADER_INFO=n

# CONFIG_BT_MAX_CONN stays at 1: updates and commissioning never overlap
# (zephyr/Kconfig, TINYFOTA_BLE_SMP).

# ---- tinylock, not from tinyfota --------------------------------------------
# SMP clients find the lock by this UUID, and the Matter advert is full: send it in the scan response.
CONFIG_TINYTALK_BLE_SCAN_RSP_UUID128="8d53dc1d-1db7-4cd3-868b-8a527460aa84"
