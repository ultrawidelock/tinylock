# tinyble on Nordic's SoftDevice Controller instead of Zephyr's controller.
# Use after stacks/tinyble.conf, and leave stacks/tinyble.overlay out.
CONFIG_BT_LL_SOFTDEVICE=y
CONFIG_BT_LL_SW_SPLIT=n
CONFIG_MPSL=y
# tinygrid's radio (stacks/tinygrid-radio.conf) then runs in MPSL timeslots,
# one session.
CONFIG_MPSL_TIMESLOT_SESSION_COUNT=1
