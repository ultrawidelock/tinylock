# Needs tinypsa on ZEPHYR_EXTRA_MODULES. Goes after stacks/tinypsa.conf when
# stacks/openthread.conf is in the set. The lines below are tinypsa's
# zephyr/tinypsa-openthread.conf at b61bb7c, verbatim.

# With zephyr/tinypsa.conf, when the image runs OpenThread: its crypto goes
# through PSA, so tinypsa. One comment per line says why it is there.

# OpenThread's stock security choice selects Mbed TLS; Custom selects nothing.
CONFIG_CUSTOM_OPENTHREAD_SECURITY=y
# OpenThread calls PSA, so tinypsa; this turns CONFIG_TINYPSA_OPENTHREAD off.
CONFIG_OPENTHREAD_CRYPTO_PSA=y
# OpenThread links this library in place of mbedTLS: tinypsa's own archive.
CONFIG_OPENTHREAD_MBEDTLS_LIB_NAME="tinypsa"
