# Needs tinypsa on ZEPHYR_EXTRA_MODULES. Goes after stacks/tinypsa.conf and
# after stacks/openthread.conf, whose thread stack size it overrides. The lines
# below are tinypsa's zephyr/tinypsa-openthread.conf at b68c4fd, verbatim.

# With zephyr/tinypsa.conf, when the image runs OpenThread: its crypto goes
# through PSA, so tinypsa. One comment per line says why it is there.

# OpenThread's stock security choice selects Mbed TLS; Custom selects nothing.
CONFIG_CUSTOM_OPENTHREAD_SECURITY=y
# OpenThread calls PSA, so tinypsa; this turns CONFIG_TINYPSA_OPENTHREAD off.
CONFIG_OPENTHREAD_CRYPTO_PSA=y
# OpenThread links this library in place of mbedTLS: tinypsa's own archive.
CONFIG_OPENTHREAD_MBEDTLS_LIB_NAME="tinypsa"
# CASE over Thread runs on this thread (OpenThread's UDP callback). On the
# board, 2026-10-17, it peaked at 3,944 B of 4,096 B, p256_verify's 1,544 B
# frame the largest; 5,120 B leaves 1,176 B, for 1,024 B of RAM. Overrides
# the 4,096 B a stock OpenThread fragment sets, so this file comes after it.
CONFIG_OPENTHREAD_THREAD_STACK_SIZE=5120
