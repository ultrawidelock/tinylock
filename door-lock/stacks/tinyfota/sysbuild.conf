# Part of stacks/tinyfota.conf, which has the build command that opts in to
# this file. tinyfota's samples/door-lock-fragment/sysbuild.conf at f85f24e, verbatim
# below; "README.md beside this file" is that directory's.

# MCUboot single slot, ECDSA P-256: the curve the receiver checks a patch
# header with. The signing key is passed on the command line, never in a
# file, with the inner quotes: '-DSB_CONFIG_BOOT_SIGNATURE_KEY_FILE="<absolute path>"'.
# NOTHING HERE MAY SET APPROTECT (samples/nrf52833/sysbuild.conf says why).
SB_CONFIG_BOOTLOADER_MCUBOOT=y
SB_CONFIG_MCUBOOT_MODE_SINGLE_APP=y
SB_CONFIG_BOOT_SIGNATURE_TYPE_ECDSA_P256=y
# One image: nothing to keep in step with MCUboot's image count. Left at y,
# sysbuild assigns CONFIG_UPDATEABLE_IMAGE_NUMBER to an application without
# IMG_MANAGER, where the symbol does not exist.
SB_CONFIG_MCUBOOT_APP_SYNC_UPDATEABLE_IMAGES=n
