# Part of stacks/tinyfota.conf, which has the build command that opts in to
# this file. tinyfota's samples/door-lock-fragment/mcuboot.conf at aca43d3, verbatim
# below; "README.md beside this file" is that directory's.

# MCUboot's whole configuration, NCS only: the single-slot bootloader with
# tinyfota's applier. Passed as -Dmcuboot_CONF_FILE=<absolute path>, so it
# REPLACES MCUboot's boot/zephyr/prj.conf and its boards/<board>.conf
# instead of being merged on top of them. Merged on top, MCUboot's own
# CONFIG_LOG=y, CONFIG_LOG_DEFAULT_LEVEL=0, CONFIG_MCUBOOT_LOG_LEVEL_INF=y and
# CONFIG_NCS_APPLICATION_BOOT_BANNER_STRING lines, and the DWM3001CDK board's
# CONFIG_BOOT_PREFER_SWAP_MOVE=y, become "was assigned" warnings once logging,
# the banner and swap mode are off, and no later line can cancel them.
# samples/nrf52833/sysbuild/mcuboot.conf says why each tinyfota line is there.

# The base MCUboot itself depends on.
# The ECDSA P-256 verify runs on the main stack; Zephyr's default is 1,024 B.
CONFIG_MAIN_STACK_SIZE=10240
CONFIG_FLASH=y
CONFIG_PM=n
CONFIG_BT=n
CONFIG_I2C=n
# mbedTLS keeps its own heap.
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=0

# One slot, validated before every jump.
CONFIG_SINGLE_APPLICATION_SLOT=y
CONFIG_BOOT_VALIDATE_SLOT0=y
CONFIG_SOC_FLASH_NRF_EMULATE_ONE_BYTE_WRITE_ACCESS=y
CONFIG_TINYFOTA_APPLIER=y

# Lock MCUboot's own region after it hands over. Not the application's: it
# writes patch_staging and settings_storage at runtime.
CONFIG_FPROTECT=y

# Size: no log, no printk, neither banner.
CONFIG_PICOLIBC=y
CONFIG_CBPRINTF_NANO=y
CONFIG_LOG=n
CONFIG_PRINTK=n
CONFIG_BOOT_BANNER=n
CONFIG_NCS_BOOT_BANNER=n
