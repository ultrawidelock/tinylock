# Needs tinygrid on ZEPHYR_EXTRA_MODULES, next to tinytalk. Replaces
# stacks/openthread.conf.

# tinygrid in place of OpenThread under tinytalk. Pair with
# -DZEPHYR_EXTRA_MODULES=<tinygrid>.
CONFIG_OPENTHREAD=n
CONFIG_TINYTALK_THREAD=n
CONFIG_TINYGRID=y
# The driver's defaults are sized for a router: twenty receive buffers and
# pending-bit tables for sixteen children of each address kind. A child
# drains every frame on its own thread and never sets a pending bit.
CONFIG_NRF_802154_RX_BUFFERS=4
CONFIG_NRF_802154_PENDING_SHORT_ADDRESSES=1
CONFIG_NRF_802154_PENDING_EXTENDED_ADDRESSES=1
# Frames arrive at the driver already secured, as 2006 frames without IEs.
CONFIG_NRF_802154_ENCRYPTION=n
CONFIG_NRF_802154_IE_WRITER=n
CONFIG_NRF_802154_SECURITY_WRITER=n
