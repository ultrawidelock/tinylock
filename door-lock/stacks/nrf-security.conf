# Stock crypto: nrf_security. Replaced by stacks/tinypsa.conf.

# ---- crypto: PSA on nrf_oberon (the nRF52833 has no CryptoCell) ---------------
CONFIG_NRF_SECURITY=y
CONFIG_MBEDTLS_PSA_CRYPTO_C=y
CONFIG_MBEDTLS_ENABLE_HEAP=y
# Measured peak across boot, PASE and CASE: 228 B. 512 broke Matter over
# Thread on 2026-08-03: OpenThread's SRP key is a PERSISTENT PSA key, and
# generating one failed with PSA_ERROR_INSUFFICIENT_MEMORY. The node then
# commissions, attaches, and never registers its name.
CONFIG_MBEDTLS_HEAP_SIZE=1024
# PSA persistent-key storage stays on (the default) for the same reason.
CONFIG_PSA_WANT_ALG_ECDSA=y
CONFIG_PSA_WANT_ALG_ECDH=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_GENERATE=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_IMPORT=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_EXPORT=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_DERIVE=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_PUBLIC_KEY=y
CONFIG_PSA_WANT_ECC_SECP_R1_256=y
CONFIG_PSA_WANT_ALG_SHA_256=y
CONFIG_PSA_WANT_ALG_ECB_NO_PADDING=y
CONFIG_PSA_WANT_KEY_TYPE_AES=y
CONFIG_PSA_WANT_GENERATE_RANDOM=y
