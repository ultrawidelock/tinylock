# Needs tinyble on ZEPHYR_EXTRA_MODULES, next to tinytalk. Replaces
# stacks/bt-host.conf.

# Stock BLE replaced: tinyble on raw HCI to Zephyr's own Bluetooth controller.
# Use instead of stacks/bt-host.conf, with stacks/tinyble.overlay (the chosen
# HCI node). stacks/tinyble-sdc.conf after it puts the SoftDevice Controller
# back.

# tinytalk's Zephyr-host port off; tinyble's adapter provides matter_ble.h.
CONFIG_TINYTALK_BLE=n
# Bluetooth on, for the controller.
CONFIG_BT=y
# Raw HCI: no Zephyr host; tinyble sends HCI through bt_send().
CONFIG_BT_HCI_RAW=y
# tinyble's core and Zephyr port.
CONFIG_TINYBLE=y
# The matter_ble.h adapter; it selects TINYTALK_HAS_BLE.
CONFIG_TINYBLE_TINYTALK=y
# One link: tinyble serves a single connection.
CONFIG_BT_MAX_CONN=1
# Peripheral role only.
CONFIG_BT_PERIPHERAL=y
# No central role.
CONFIG_BT_CENTRAL=n
# No scanning.
CONFIG_BT_OBSERVER=n
# Connectable advertising.
CONFIG_BT_BROADCASTER=y
# Legacy advertising only.
CONFIG_BT_EXT_ADV=n
# The SoftDevice Controller's peripheral-only library.
CONFIG_BT_LL_SOFTDEVICE_PERIPHERAL=y
# 1M PHY only: no Coded PHY.
CONFIG_BT_CTLR_PHY_CODED=n
# 1M PHY only: no 2M PHY.
CONFIG_BT_CTLR_PHY_2M=n
# No LE Ping.
CONFIG_BT_CTLR_LE_PING=n
# Raw HCI turns this back on; Zephyr's host build has it off.
CONFIG_BT_PHY_UPDATE=n
# Raw HCI turns this back on; Zephyr's host build has it off.
CONFIG_BT_CTLR_PRIVACY=n
# Raw HCI turns this back on; Zephyr's host build has it off.
CONFIG_BT_CTLR_FILTER_ACCEPT_LIST=n
# The reader's RSSI gate reads the link's RSSI; without it the gate has no
# samples and fails open.
CONFIG_BT_CTLR_CONN_RSSI=y
# Raw HCI turns this back on; Zephyr's host build has it off.
CONFIG_BT_HCI_VS=n
# tinyble never enables controller-to-host flow control.
CONFIG_BT_HCI_ACL_FLOW_CONTROL=n
# SDC driver logs at warning level, as in the Zephyr-host build.
CONFIG_BT_HCI_DRIVER_LOG_LEVEL_WRN=y
# 27 B ACL packets: tinyble reassembles and splits L2CAP PDUs, so no data length update.
CONFIG_BT_DATA_LEN_UPDATE=n
# Two HCI event buffers (M2's pools; M3 commissioned with them, M2 bench still open).
CONFIG_BT_BUF_EVT_RX_COUNT=2
# One ACL TX buffer (M2's pools; M3 commissioned with them, M2 bench still open).
CONFIG_BT_BUF_ACL_TX_COUNT=1

# Zephyr's controller (Apache-2.0) in place of the SoftDevice Controller: no
# Nordic binary. It takes RTC0, TIMER0 and the radio, so no MPSL either;
# tinygrid's radio (stacks/tinygrid-radio.conf) runs in this controller's
# scheduler instead.
CONFIG_BT_LL_SOFTDEVICE=n
CONFIG_BT_LL_SW_SPLIT=y
CONFIG_MPSL=n
# The setting below sits in the controller's "Advanced features" menu and is
# ignored unless that menu is open.
CONFIG_BT_CTLR_ADVANCED_FEATURES=y
# Raw HCI turns this on, and with it BT_CTLR_FORCE_MD_AUTO, which divides by
# the measured Tx rate. That rate rounds to zero when a connection's first
# packets follow a long idle gap: division by zero, controller halted.
# Zephyr's host build has it off.
CONFIG_BT_CTLR_THROUGHPUT=n
