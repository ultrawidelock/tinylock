# Needs tinyfota and tinyble on ZEPHYR_EXTRA_MODULES, next to tinytalk. Adds
# DFU on top of stacks/tinyble.conf in place of stacks/tinyfota.conf, with the
# three files in stacks/tinyfota/ passed as stacks/tinyfota.conf says. The
# lines below are tinyfota's samples/door-lock-fragment/tinyfota-tinyble.conf
# at 7782778, verbatim; "README.md beside this file" is that directory's.

# tinyfota receiver on tinyble, for an application that owns sw0 and keeps
# one BLE connection: SMP and the native frames over tinyble's GATT, without
# mcumgr or Zephyr's Bluetooth host; no tinyfota button, no recovery gesture.
# Used INSTEAD of tinyfota.conf on a tinyble build, with the same
# sysbuild.conf, mcuboot.conf and pm_static.yml. The application opens the
# update window with tinyfota_window_open().
# README.md beside this file says where each line comes from.

CONFIG_TINYFOTA_RECEIVER=y
CONFIG_TINYFOTA_TINYBLE=y
CONFIG_TINYFOTA_BUTTON=n
CONFIG_TINYFOTA_RECOVERY_GESTURE=n
CONFIG_FLASH_PAGE_LAYOUT=y

# In single-slot mode MCUboot's trailer does not depend on the sector count
# (samples/nrf52833/pm_static.yml says why).
CONFIG_MCUBOOT_EXTRA_IMGTOOL_ARGS="--max-sectors 1"

# zcbor, which the SMP server encodes and decodes with. mcumgr is not built.
CONFIG_ZCBOR=y

# tinyble: tinyfota's SMP and native services in its GATT table, their writes
# handed to TINYFOTA_TINYBLE. Nothing stands in front of the SMP endpoint but
# the update window and the reset gate (ports/zephyr/smp_group.c).
CONFIG_TINYBLE_TINYFOTA=y
# SMP clients find the board by this UUID, and the Matter advert is full: it
# goes in the scan response.
CONFIG_TINYBLE_TINYTALK_SCAN_RSP_UUID128="8d53dc1d-1db7-4cd3-868b-8a527460aa84"

# CONFIG_BT_MAX_CONN stays at 1: updates and commissioning never overlap
# (zephyr/Kconfig, TINYFOTA_BLE_SMP).
