# Needs tinypsa on ZEPHYR_EXTRA_MODULES, next to tinytalk. Replaces
# stacks/nrf-security.conf; with stacks/openthread.conf add
# stacks/tinypsa-openthread.conf after it. The lines below are tinypsa's
# zephyr/tinypsa.conf at b61bb7c, verbatim.

# tinypsa as the PSA Crypto provider of a Bluetooth plus Thread plus tinytalk
# image on NCS. A sample copies these lines verbatim; one comment per line
# says why it is there. With OpenThread, add tinypsa-openthread.conf too.

# ---- provider ----------------------------------------------------------------
# The PSA Crypto API, called by the Bluetooth host, OpenThread and tinytalk.
CONFIG_PSA_CRYPTO=y
# An out-of-tree provider; CONFIG_TINYPSA depends on it and defaults on.
CONFIG_PSA_CRYPTO_PROVIDER_CUSTOM=y
# nrf_security would be a second PSA provider: it must be off.
CONFIG_NRF_SECURITY=n
# Keys held at once, estimated from the sources: OpenThread's 6 volatile AES
# keys plus 4 at a key rotation, 1 cached persistent, 2 tinytalk, 1 BT host.
CONFIG_TINYPSA_KEY_SLOTS=16

# ---- PSA_WANT: what the image calls (sizes the PSA headers' buffer macros) ----
# CASE signs and verifies (tinytalk); OpenThread verifies too.
CONFIG_PSA_WANT_ALG_ECDSA=y
# OpenThread's SRP client signs its updates deterministically (RFC 6979).
CONFIG_PSA_WANT_ALG_DETERMINISTIC_ECDSA=y
# CASE's shared secret (tinytalk).
CONFIG_PSA_WANT_ALG_ECDH=y
# CASE's ephemeral key and OpenThread's SRP key are generated.
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_GENERATE=y
# tinytalk imports its operational key for each signature and ECDH.
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_IMPORT=y
# tinytalk stores the private keys it generates; OpenThread exports its SRP key.
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_EXPORT=y
# Peer public keys, imported to verify.
CONFIG_PSA_WANT_KEY_TYPE_ECC_PUBLIC_KEY=y
# The one curve: Matter's and Thread SRP's.
CONFIG_PSA_WANT_ECC_SECP_R1_256=y
# Matter's hashes (tinytalk's SHA-256 is PSA multipart) and OpenThread's.
CONFIG_PSA_WANT_ALG_SHA_256=y
# One AES block at a time: Matter's CCM in tinytalk, OpenThread's MAC and MLE.
CONFIG_PSA_WANT_ALG_ECB_NO_PADDING=y
# AES-128 and AES-256 keys for the line above.
CONFIG_PSA_WANT_KEY_TYPE_AES=y
# Every random byte: nonces, keys, Thread and Bluetooth host.
CONFIG_PSA_WANT_GENERATE_RANDOM=y
# OpenThread derives its MAC and MLE keys from the network key by HMAC-SHA-256.
CONFIG_PSA_WANT_ALG_HMAC=y
# The network key is stored as a persistent HMAC key.
CONFIG_PSA_WANT_KEY_TYPE_HMAC=y
# OpenThread computes a PSKc from a passphrase with PBKDF2-AES-CMAC-PRF-128.
CONFIG_PSA_WANT_ALG_PBKDF2_AES_CMAC_PRF_128=y
# The PRF of the line above.
CONFIG_PSA_WANT_ALG_CMAC=y
# The passphrase goes in as a password key.
CONFIG_PSA_WANT_KEY_TYPE_PASSWORD=y
# The PSKc is stored as a persistent raw-data key.
CONFIG_PSA_WANT_KEY_TYPE_RAW_DATA=y
