# The release profile: no logging, no RTT console, no Bluetooth asserts, no boot
# banner. Add it to prj.conf with
#   west build ... -- -DEXTRA_CONF_FILE=overlay-release.conf
#
# Measured 2026-10-16 on decawave_dwm3001cdk, LTO on: 22,004 B less flash and
# 8,576 B less RAM than prj.conf alone, most of the RAM being the RTT buffer.
# The image says nothing over RTT, so keep a prj.conf build for debugging.
#
# Kconfig warns that prj.conf's logging and RTT values no longer apply; that is
# expected. CONFIG_PRINTK stays on: another symbol selects it, and with no
# console it prints nowhere.
CONFIG_LOG=n
CONFIG_CONSOLE=n
CONFIG_RTT_CONSOLE=n
CONFIG_USE_SEGGER_RTT=n
CONFIG_BT_ASSERT=n
CONFIG_ASSERT_VERBOSE=n
CONFIG_NCS_BOOT_BANNER=n
