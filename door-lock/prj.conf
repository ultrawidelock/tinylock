# tinytalk door-lock sample: a Matter Door Lock on an nRF52833, commissioned
# over BLE, operated over Thread. Measured facts below were measured in
# ultrawidelock, on its DWM3001CDK image, on the dates given.

# ---- tinytalk ---------------------------------------------------------------
CONFIG_TINYTALK=y
CONFIG_TINYTALK_BLE=y
CONFIG_TINYTALK_THREAD=y
CONFIG_TINYTALK_DOOR_LOCK=y
CONFIG_GPIO=y
# The factory-reset press reboots.
CONFIG_REBOOT=y
# The fabric store and OpenThread keep their state in settings, on NVS.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
# 16 KB, four NVS sectors: what the source image ran its fabrics, OpenThread and
# its reader keys in on hardware. The 8 KB default leaves one usable sector.
CONFIG_PM_PARTITION_SIZE_SETTINGS_STORAGE=0x4000
# The DWM3001CDK's devicetree enables its LIS2DH accelerometer; nothing here
# reads it.
CONFIG_LIS2DH=n
CONFIG_I2C=n
CONFIG_SIZE_OPTIMIZATIONS=y
# Link-time optimisation: 33,460 B less flash on the DWM3001CDK, measured
# 2026-10-16. The source project ran it on every Matter over Thread image and
# proved it on hardware on 2026-08-02, with a UWB walk-up unlock whose ranging
# path has a ~1836 us arm deadline.
#
# BOTH LINES ARE REQUIRED. `CONFIG_LTO=y` on its own is a silent no-op: the
# symbol depends on
#   !(GEN_ISR_TABLES || GEN_IRQ_VECTOR_TABLE) || ISR_TABLES_LOCAL_DECLARATION
# (zephyr/Kconfig.zephyr), and with that unmet Kconfig drops it from the
# generated .config without a warning. Grep the build's zephyr/.config for both
# before trusting a size.
#
# CONFIG_SIZE_OPTIMIZATIONS_AGGRESSIVE (-Oz) is a measured dead end: in the
# source project, 2026-08-22, it came out 1 byte smaller than -Os on this GCC,
# and -flto-partition=one bought nothing either.
CONFIG_LTO=y
CONFIG_ISR_TABLES_LOCAL_DECLARATION=y
CONFIG_HEAP_MEM_POOL_SIZE=4096
CONFIG_MAIN_STACK_SIZE=4096
# Measured 2026-08-02 from the stack paint, with the source's credential reader
# also on this queue: peak 3,872 B, and 4096 faulted. Not re-measured without it.
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=6144

# ---- BLE: commissioning only ----------------------------------------------------
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_MAX_CONN=1
CONFIG_BT_MAX_PAIRED=0
CONFIG_BT_DEVICE_NAME="tinytalk"
# matter_ble_publish() registers and withdraws the 0xFFF6 service at runtime,
# so the GATT table matches the advert.
CONFIG_BT_GATT_DYNAMIC_DB=y
CONFIG_BT_GATT_CACHING=n
# An ATT MTU of 251: BTP fragments fit one PDU.
CONFIG_BT_L2CAP_TX_MTU=251
CONFIG_BT_BUF_ACL_RX_SIZE=255
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_EATT=n
# Matter's BTP needs none of these. The controller's data length stays at 27 B
# (CONFIG_BT_CTLR_DATA_LENGTH_MAX), so the host's update procedure bought
# nothing. Measured 2026-10-16 on decawave_dwm3001cdk, LTO on: 6,004 B less
# flash and 256 B less RAM, all six together. Apple Home paired with them off
# the same day, but that iPhone took an ATT MTU of 185 B (BTP fragment 182 B)
# where the build before them got 247 B.
CONFIG_BT_GATT_READ_MULTIPLE=n
CONFIG_BT_GATT_READ_MULT_VAR_LEN=n
CONFIG_BT_PHY_UPDATE=n
CONFIG_BT_DATA_LEN_UPDATE=n
CONFIG_BT_AUTO_DATA_LEN_UPDATE=n
CONFIG_BT_HCI_VS=n
# Ask for 15-30 ms, no latency, 2 s supervision, 300 ms after connecting. The
# timeout is the lever: Zephyr sends the PREF values when it fires. Measured
# 2026-08-06: an iPhone grants 30 ms whatever it is asked, but keeps the 2 s
# supervision instead of Zephyr's 420 ms default.
CONFIG_BT_CONN_PARAM_UPDATE_TIMEOUT=300
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=12
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=24
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=200

# ---- crypto: PSA on nrf_oberon (the nRF52833 has no CryptoCell) ---------------
CONFIG_NRF_SECURITY=y
CONFIG_MBEDTLS_PSA_CRYPTO_C=y
CONFIG_MBEDTLS_ENABLE_HEAP=y
# Measured peak across boot, PASE and CASE: 228 B. 512 broke Matter over
# Thread on 2026-08-03: OpenThread's SRP key is a PERSISTENT PSA key, and
# generating one failed with PSA_ERROR_INSUFFICIENT_MEMORY. The node then
# commissions, attaches, and never registers its name.
CONFIG_MBEDTLS_HEAP_SIZE=1024
# PSA persistent-key storage stays on (the default) for the same reason.
CONFIG_PSA_WANT_ALG_ECDSA=y
CONFIG_PSA_WANT_ALG_ECDH=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_GENERATE=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_IMPORT=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_EXPORT=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_DERIVE=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_PUBLIC_KEY=y
CONFIG_PSA_WANT_ECC_SECP_R1_256=y
CONFIG_PSA_WANT_ALG_SHA_256=y
CONFIG_PSA_WANT_ALG_ECB_NO_PADDING=y
CONFIG_PSA_WANT_KEY_TYPE_AES=y
CONFIG_PSA_WANT_GENERATE_RANDOM=y

# ---- Thread: an OpenThread MTD ----------------------------------------------------
CONFIG_OPENTHREAD=y
CONFIG_OPENTHREAD_MTD=y
CONFIG_OPENTHREAD_SRP_CLIENT=y
CONFIG_OPENTHREAD_SLAAC=y
# The node starts Thread when a commissioner hands it a dataset.
CONFIG_OPENTHREAD_MANUAL_START=y
# The Interaction Model runs on this stack. The 3,168 B default overflowed at
# CommissioningComplete; measured peak after a complete pairing: 3,072 B.
CONFIG_OPENTHREAD_THREAD_STACK_SIZE=4096
# Nothing calls otPing* or otInstanceGetUptime*: 936 B of dead text.
CONFIG_OPENTHREAD_PING_SENDER=n
CONFIG_OPENTHREAD_UPTIME=n
# An always-listening MTD child uses none of 1.2 to 1.4's additions (CSL,
# enhanced-ACK probing, multicast registration). Measured 2026-10-16 on
# decawave_dwm3001cdk, LTO on: 4,932 B less flash and 384 B less RAM than 1.4.
CONFIG_OPENTHREAD_THREAD_VERSION_1_1=y

# ---- logging: RTT, the board's only console ---------------------------------------
CONFIG_UART_CONSOLE=n
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_BT_LOG_LEVEL_WRN=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
# Boot output exceeds the 1 KB default, and a full buffer silently drops.
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=8192
